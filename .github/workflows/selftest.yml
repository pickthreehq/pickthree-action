# Generated by `pnpm -F @solonex/pickthree pack:action` — edit src/wrapper-action.ts, not this file.
name: Selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number in THIS repository to review with dry-run (needs ANTHROPIC_API_KEY)"
        required: true

permissions:
  contents: read

jobs:
  metadata:
    name: action.yml and the public-artifact guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: action.yml declares every input, output and the branding
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          y = pathlib.Path("action.yml").read_text()
          inputs, rest = y.split("outputs:", 1)
          outputs, runs = rest.split("runs:", 1)
          need_in = ["github-token", "config", "dry-run", "force", "pr", "license", "image", "version", "digest", "registry-token", "registry-username"]
          need_out = ["outcome", "inline-count", "minor-count", "checks-failed", "cost-usd", "review-url", "head-sha"]
          missing = [k for k in need_in if not re.search(r"^  %s:$" % re.escape(k), inputs, re.M)]
          missing += [k for k in need_out if not re.search(r"^  %s:$" % re.escape(k), outputs, re.M)]
          if missing: sys.exit("action.yml is missing: %s" % missing)
          if 'using: "composite"' not in runs: sys.exit("the action must be a composite action")
          if "Pickthree code review" not in y or "check-circle" not in y: sys.exit("name/branding missing")
          print("action.yml ok")
          PY
      - name: no source code, no OSS wording, no unpinned image
        run: |
          set -uo pipefail
          fail=0
          if find . -path ./.git -prune -o -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.js' \) -print | grep .; then
            echo "::error::source files found — this repository must contain no Pickthree code"; fail=1
          fi
          if grep -niE 'open[- ]?source' action.yml README.md LICENSE | grep -viE 'not open source|no licence to its source'; then
            echo "::error::that wording must not appear except in a denial (spec: never claim otherwise)"; fail=1
          fi
          if grep -nE 'default: "latest"|:latest' action.yml; then
            echo "::error::the image reference must be pinned"; fail=1
          fi
          [ "$fail" = 0 ] && echo "guards ok"
          exit $fail
      - name: the image must stay private
        run: |
          # Access is granted per customer with a read-only registry token, never by making the
          # package public. An anonymous pull that succeeds is a misconfiguration, not good news.
          if docker manifest inspect ghcr.io/pickthreehq/pickthree:0.1.0 > /dev/null 2>&1; then
            echo "::error::ghcr.io/pickthreehq/pickthree:0.1.0 is anonymously pullable — the image must be private"; exit 1
          fi
          echo "ghcr.io/pickthreehq/pickthree:0.1.0 is not anonymously pullable, as intended"

  invoke:
    name: live dry-run review
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - id: review
        uses: ./
        with:
          registry-token: ${{ secrets.REGISTRY_TOKEN || github.token }}
          pr: ${{ github.event.inputs.pr }}
          dry-run: "true"
          force: "true"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: echo "outcome=${{ steps.review.outputs.outcome }} cost=${{ steps.review.outputs.cost-usd }}"
