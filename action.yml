# Generated by `pnpm -F @solonex/pickthree pack:action` — edit src/wrapper-action.ts, not this file.
# This repository is the public Marketplace wrapper and contains no Pickthree source code:
# it runs the published, closed container image. Reviewer, prompts and pipeline live in that image.
name: "Pickthree code review"
description: "Quiet AI code review on your own infrastructure and your own API keys: a walkthrough and at most 10 inline comments per pull request, or silence."
author: "Pickthree"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  github-token:
    description: "Token used to read the pull request and post the review. The workflow token is enough with `permissions: contents: read, pull-requests: write, issues: write`. A PAT or GitHub App token additionally lets Pickthree resolve the threads of findings you fixed."
    required: false
    default: ${{ github.token }}
  config:
    description: "Path, inside the workflow's checkout, to a .pickthree.yaml applied as the top configuration layer. Optional — the repository's own .pickthree.yaml is read from the pull request head through the API, with no checkout."
    required: false
    default: ""
  dry-run:
    description: "Print the review to the job log instead of posting it. Nothing is marked reviewed."
    required: false
    default: "false"
  force:
    description: "Review the head even if it was already reviewed, and the whole pull request (no incremental scoping)."
    required: false
    default: "false"
  pr:
    description: "Pull request number — only needed for workflow_dispatch."
    required: false
    default: ""
  license:
    description: "Pickthree license token (paid tiers). Without it: free on public repositories, and on private repositories up to 3 developers a month. Pass it from a secret."
    required: false
    default: ""
  image:
    description: "Image repository to run. Change it only to point at your own mirror (air-gapped installs)."
    required: false
    default: "ghcr.io/pickthreehq/pickthree"
  version:
    description: "Image tag to run. The default is the release this cut of the action was built against."
    required: false
    default: "0.1.0"
  digest:
    description: "Pin the image by digest (sha256:...). Wins over `version`; recommended in production."
    required: false
    default: ""
  registry-token:
    description: "Credential for `docker login` against the image registry. The workflow token works for any image your repository may pull; set it to an empty string for an anonymous pull."
    required: false
    default: ${{ github.token }}
  registry-username:
    description: "Username for `docker login`."
    required: false
    default: ${{ github.actor }}

outputs:
  outcome:
    description: "posted | dry-run | check-run | skipped:<reason> | ignored | command | reply"
    value: ${{ steps.review.outputs.outcome }}
  inline-count:
    description: "Inline findings posted"
    value: ${{ steps.review.outputs.inline-count }}
  minor-count:
    description: "Findings collapsed into the walkthrough"
    value: ${{ steps.review.outputs.minor-count }}
  checks-failed:
    description: "Required pre-merge checks that failed (empty when none are configured)"
    value: ${{ steps.review.outputs.checks-failed }}
  cost-usd:
    description: "LLM cost of this run, from actual token usage"
    value: ${{ steps.review.outputs.cost-usd }}
  review-url:
    description: "URL of the posted review, when there were inline findings"
    value: ${{ steps.review.outputs.review-url }}
  head-sha:
    description: "Commit that was reviewed"
    value: ${{ steps.review.outputs.head-sha }}

runs:
  using: "composite"
  steps:
    - name: Resolve the image reference
      id: image
      shell: bash
      env:
        PT_IMAGE: ${{ inputs.image }}
        PT_VERSION: ${{ inputs.version }}
        PT_DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail
        if [ -n "$PT_DIGEST" ]; then
          case "$PT_DIGEST" in
            sha256:*) ref="$PT_IMAGE@$PT_DIGEST" ;;
            *) echo "::error title=Pickthree: bad digest::the 'digest' input must look like sha256:<64 hex>"; exit 2 ;;
          esac
        else
          if [ "$PT_VERSION" = "latest" ]; then
            echo "::error title=Pickthree: unpinned image::pin 'version' to a release, or pass 'digest'"
            exit 2
          fi
          ref="$PT_IMAGE:$PT_VERSION"
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "Pickthree image: $ref"

    - name: Sign in to the image registry
      if: inputs.registry-token != ''
      shell: bash
      env:
        PT_REGISTRY_TOKEN: ${{ inputs.registry-token }}
        PT_REGISTRY_USERNAME: ${{ inputs.registry-username }}
        PT_IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        # A bare name ("pickthree:1.0.0") is a local or Docker-Hub-library image with no registry
        # host to sign in to — `docker login pickthree` would fail on DNS. Skip instead.
        case "$PT_IMAGE" in
          */*) registry="${PT_IMAGE%%/*}" ;;
          *) echo "::notice title=Pickthree::'$PT_IMAGE' names no registry — skipping docker login"; exit 0 ;;
        esac
        printf '%s' "$PT_REGISTRY_TOKEN" | docker login "$registry" --username "$PT_REGISTRY_USERNAME" --password-stdin

    - name: Review
      id: review
      shell: bash
      env:
        PT_IMAGE_REF: ${{ steps.image.outputs.ref }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_PR: ${{ inputs.pr }}
        PICKTHREE_LICENSE: ${{ inputs.license }}
      run: |
        set -euo pipefail
        work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/pickthree.XXXXXX")"
        chmod 777 "$work"
        # The image runs as uid 1000, which does not own the runner's files: copy the event payload
        # in and give the container its own outputs file instead of bind-mounting the runner's.
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
          cp "$GITHUB_EVENT_PATH" "$work/event.json"
        else
          echo '{}' > "$work/event.json"
        fi
        : > "$work/output"
        chmod 666 "$work/event.json" "$work/output"

        args=(--rm
          --env GITHUB_REPOSITORY --env GITHUB_EVENT_NAME --env GITHUB_SERVER_URL
          --env GITHUB_EVENT_PATH=/pickthree/event.json --env GITHUB_OUTPUT=/pickthree/output
          --env INPUT_GITHUB_TOKEN --env INPUT_DRY_RUN --env INPUT_FORCE --env INPUT_PR
          --env PICKTHREE_STATE= --env PICKTHREE_DATA_DIR=
          --volume "$work:/pickthree")
        if [ -n "$INPUT_CONFIG" ]; then
          args+=(--env "INPUT_CONFIG=/workspace/$INPUT_CONFIG" --volume "${GITHUB_WORKSPACE}:/workspace:ro")
        fi
        # Every deployment variable the Action reads (the registry in src/env-reference.ts),
        # forwarded by NAME only — the values never appear in the command line or the log.
        for v in GITHUB_API_URL DATABASE_URL ANTHROPIC_API_KEY ANTHROPIC_BASE_URL OPENAI_API_KEY OPENAI_BASE_URL GOOGLE_GENERATIVE_AI_API_KEY GEMINI_API_KEY AWS_REGION AWS_DEFAULT_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_BEARER_TOKEN_BEDROCK GOOGLE_VERTEX_PROJECT GOOGLE_VERTEX_LOCATION OPENROUTER_API_KEY OPENAI_COMPATIBLE_BASE_URL OPENAI_COMPATIBLE_API_KEY CLAUDE_CODE_OAUTH_TOKEN PICKTHREE_SUBSCRIPTION_MAX_WAIT PICKTHREE_CLAUDE_SESSIONS PICKTHREE_CLAUDE_STRUCTURED PICKTHREE_CONFIG_YAML PICKTHREE_PROFILE PICKTHREE_QUALITY PICKTHREE_PROVIDER MODEL_FAST MODEL_REVIEW MODEL_JUDGE PICKTHREE_ORG_CONFIG_REPO PICKTHREE_LOG_LEVEL PICKTHREE_LOG_FORMAT PICKTHREE_LICENSE LINEAR_API_KEY JIRA_API_TOKEN JIRA_EMAIL; do
          if [ -n "${!v:-}" ]; then args+=(--env "$v"); fi
        done

        status=0
        docker run "${args[@]}" "$PT_IMAGE_REF" action || status=$?
        cat "$work/output" >> "$GITHUB_OUTPUT"
        rm -rf "$work"
        exit $status
